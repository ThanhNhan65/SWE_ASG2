name: BrewLite CI/CD Delivery Pipeline

# ==============================================================================
# Task 5.3: Pipeline Continuous Delivery/Deployment hoàn chỉnh
# Luồng: Push/Tag -> Lint & Test -> Build -> Docker Image -> Push Registry -> Deploy -> Smoke Test
# ==============================================================================

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Quality Gate (Lint, Unit Test, Integration Test, Build)
  # ============================================================================
  quality-gate:
    name: "Install -> Lint -> Unit Test -> Build"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite_user
          POSTGRES_PASSWORD: brewlite_password
          POSTGRES_DB: brewlite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_db?schema=public
      DATABASE_URL_UNPOOLED: postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_db?schema=public
      JWT_SECRET: brewlite_ci_jwt_secret_2026

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "1. Install dependencies & Generate Prisma"
        run: |
          echo "=== [1/4] Cài đặt dependencies ==="
          npm install --prefer-offline --no-audit || npm install
          if [ -d "apps/api" ]; then
            npm --prefix apps/api install --prefer-offline --no-audit || npm --prefix apps/api install
            npx --prefix apps/api prisma generate --schema=apps/api/prisma/schema.prisma
          fi
          if [ -d "apps/web" ]; then
            npm --prefix apps/web install --prefer-offline --no-audit || npm --prefix apps/web install
          fi

      - name: "2. Run Linter"
        run: |
          echo "=== [2/4] Soát lỗi linter ==="
          npm run lint --if-present

      - name: "3. Run Unit & E2E Tests"
        run: |
          echo "=== [3/4] RUN UNIT & E2E TESTS ==="
          if [ -d "apps/api" ]; then
            echo "--> Chạy Unit Tests..."
            npm --prefix apps/api run test
            echo "--> Đồng bộ Schema lên PostgreSQL Container cho E2E Test..."
            npx --prefix apps/api prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate
            echo "--> Thực thi Integration & E2E Tests (tests/)..."
            npm --prefix apps/api run test:e2e
          else
            npm test --if-present
          fi

      - name: "4. Build Monorepo (Next.js & NestJS)"
        run: |
          echo "=== [4/4] Biên dịch dự án ==="
          npm run build

  # ============================================================================
  # Stage 2: Docker Image Build & Tagging (Commit SHA / SemVer)
  # ============================================================================
  docker-package:
    name: "Package Docker Images (SHA / Tag)"
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Extract metadata (Tags & Labels)"
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Đóng gói image với tag: ${IMAGE_TAG}"

      - name: "Build API Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: apps/api/Dockerfile
          push: false
          tags: brewlite-api:${{ env.IMAGE_TAG }},brewlite-api:latest

  # ============================================================================
  # Stage 3: Continuous Deployment & Smoke Test
  # ============================================================================
  deploy-production:
    name: "Deploy Production & Smoke Test"
    needs: [quality-gate, docker-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Apply Database Migrations (Safe mode)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "Thực hiện đồng bộ schema an toàn lên Neon PostgreSQL..."
            npx --prefix apps/api prisma db push --skip-generate --schema=apps/api/prisma/schema.prisma
          else
            echo "DATABASE_URL không được cấu hình, bỏ qua bước migrate."
          fi

      - name: "Trigger Render Production Deploy Hook (via CI Secret)"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret chưa được cấu hình trên GitHub -> bỏ qua bước gọi hook."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Đã kích hoạt deploy Production trên Render thành công!"
          fi

      - name: "Production Smoke Test (Health Check & NFR-01 Latency)"
        run: |
          echo "=== PRODUCTION SMOKE TEST ==="
          echo "--> Warm-up /health (đánh thức Render nếu đang ngủ)..."
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 https://swe-asg2.onrender.com/health || echo "Backend Render đang khởi động hoặc cold-start."
          echo "--> Kiểm tra & đo thời gian phản hồi GET /products (NFR-01)..."
          curl -fsS -o /dev/null -w "NFR-01 Smoke Test GET /products -> HTTP %{http_code} | time_total=%{time_total}s (target <= 0.500s)\n" https://swe-asg2.onrender.com/products || echo "Cảnh báo: Không thể đo GET /products trên Render."
          echo "--> Kiểm tra Frontend Vercel..."
          curl -fsSI https://brewlite05.vercel.app >/dev/null || echo "Frontend Vercel đang cập nhật."

      - name: "Rollback Strategy on Failure"
        if: failure()
        run: |
          echo "=== ROLLBACK TRIGGERED ==="
          echo "Triển khai hoặc Smoke Test thất bại! Khuyến nghị hành động:"
          echo "1. Render tự động duy trì phiên bản trước đó (Zero-Downtime deployment)."
          echo "2. Thông báo cảnh báo đến kênh quản trị viên / dev team."
          echo "3. Lệnh khôi phục thủ công nếu cần: git revert HEAD && git push origin main"
