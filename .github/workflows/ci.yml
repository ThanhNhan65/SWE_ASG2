name: BrewLite CI Pipeline

# ==============================================================================
# Task 4.7: Thiết lập CI Pipeline chạy theo Pull Request
# Quy trình: Install -> Lint -> Unit Test -> Build
# Người phụ trách: Đặng Hoàng Nam (TV6)
# ==============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Cho phép kích hoạt kiểm thử thủ công từ tab Actions trên GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: "Install -> Lint -> Unit Test -> Build"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite_user
          POSTGRES_PASSWORD: brewlite_password
          POSTGRES_DB: brewlite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_db?schema=public
      DATABASE_URL_UNPOOLED: postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_db?schema=public
      JWT_SECRET: brewlite_ci_jwt_secret_2026

    steps:
      # Bước 0: Checkout mã nguồn & chuẩn bị môi trường
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Giai đoạn 1: Install dependencies
      - name: "1. Install dependencies"
        run: |
          echo "=== [1/4] INSTALL DEPENDENCIES ==="
          npm install --prefer-offline --no-audit || npm install
          
          if [ -d "apps/api" ]; then
            echo "--> Cài đặt dependencies cho Backend (apps/api)..."
            npm --prefix apps/api install --prefer-offline --no-audit || npm --prefix apps/api install
            echo "--> Sinh mã Prisma Client..."
            npx --prefix apps/api prisma generate --schema=apps/api/prisma/schema.prisma
          fi

          if [ -d "apps/web" ]; then
            echo "--> Cài đặt dependencies cho Frontend (apps/web)..."
            npm --prefix apps/web install --prefer-offline --no-audit || npm --prefix apps/web install
          fi

      # Giai đoạn 2: Lint
      - name: "2. Run Linter"
        run: |
          echo "=== [2/4] RUN LINTER ==="
          npm run lint

      # Giai đoạn 3: Unit Test & Integration/E2E Test
      - name: "3. Run Unit & E2E Tests"
        run: |
          echo "=== [3/4] RUN UNIT & E2E TESTS ==="
          if [ -d "apps/api" ]; then
            echo "--> Thực thi Unit Tests Backend (Vitest)..."
            npm --prefix apps/api run test
            echo "--> Đồng bộ Schema lên PostgreSQL Container cho E2E Test..."
            npx --prefix apps/api prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate
            echo "--> Thực thi Integration & E2E Tests (tests/)..."
            npm --prefix apps/api run test:e2e
          else
            npm test
          fi

      # Giai đoạn 4: Build
      - name: "4. Build applications"
        run: |
          echo "=== [4/4] BUILD APPLICATIONS ==="
          npm run build
          echo "Hoàn thành toàn bộ quy trình CI Pipeline!"

  deploy-production:
    name: "Deploy Production (via CI Secret)"
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: "Trigger Render Production Deploy Hook"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret chưa được cấu hình trên GitHub -> bỏ qua bước gọi hook."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Đã kích hoạt deploy Production trên Render thành công!"
          fi

      - name: "Production Smoke Test (Health Check)"
        run: |
          echo "=== PRODUCTION SMOKE TEST ==="
          curl -fsS https://swe-asg2.onrender.com/health || echo "Backend Render đang khởi động hoặc cold-start."
          curl -fsSI https://brewlite05.vercel.app >/dev/null || echo "Frontend Vercel đang cập nhật."
